apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-miner-policy
  namespace: openshell
data:
  policy.yaml: |
    version: 1

    filesystem_policy:
      include_workdir: true
      read_only:
        - /usr
        - /lib
        - /lib64
        - /opt
        - /app
        - /etc
      read_write:
        - /sandbox
        - /tmp
        - /dev/null

    landlock:
      compatibility: best_effort

    process:
      run_as_user: sandbox
      run_as_group: sandbox

    network_policies:
      gmail_read:
        name: "Gmail API (read only)"
        endpoints:
          - host: gmail.googleapis.com
            port: 443
            protocol: rest
            tls: terminate
            enforcement: enforce
            rules:
              - allow:
                  method: GET
                  path: /gmail/v1/users/me/**
        binaries:
          - { path: /opt/app-root/bin/python3 }

      docs_read:
        name: "Google Docs API (read any doc)"
        endpoints:
          - host: docs.googleapis.com
            port: 443
            protocol: rest
            tls: terminate
            enforcement: enforce
            rules:
              - allow:
                  method: GET
                  path: /v1/documents/**
        binaries:
          - { path: /opt/app-root/bin/python3 }

      docs_write_radar:
        name: "Google Docs API (write Radar doc only)"
        endpoints:
          - host: docs.googleapis.com
            port: 443
            protocol: rest
            tls: terminate
            enforcement: enforce
            rules:
              - allow:
                  method: POST
                  path: /v1/documents/__RADAR_DOC_ID__:batchUpdate
        binaries:
          - { path: /opt/app-root/bin/python3 }

      oauth:
        name: "Google OAuth2 token refresh"
        endpoints:
          - host: oauth2.googleapis.com
            port: 443
            protocol: rest
            tls: terminate
            enforcement: enforce
            rules:
              - allow:
                  method: POST
                  path: /token
        binaries:
          - { path: /opt/app-root/bin/python3 }

      slack:
        name: "Slack webhook (DM only)"
        endpoints:
          - host: hooks.slack.com
            port: 443
            protocol: rest
            tls: terminate
            enforcement: enforce
            rules:
              - allow:
                  method: POST
                  path: /services/**
        binaries:
          - { path: /opt/app-root/bin/python3 }

      jira:
        name: "Jira API (search only)"
        endpoints:
          - host: redhat.atlassian.net
            port: 443
            protocol: rest
            tls: terminate
            enforcement: enforce
            rules:
              - allow:
                  method: GET
                  path: /rest/api/2/search
        binaries:
          - { path: /opt/app-root/bin/python3 }

      inference:
        name: "LLM inference via OpenShell gateway"
        endpoints:
          - host: inference.local
            port: 443
            protocol: rest
            tls: terminate
            enforcement: enforce
            rules:
              - allow:
                  method: POST
                  path: /v1/**
        binaries:
          - { path: /opt/app-root/bin/python3 }
