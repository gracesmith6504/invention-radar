apiVersion: batch/v1
kind: CronJob
metadata:
  name: meeting-miner
  namespace: openshell
spec:
  schedule: "0 17 * * 1-5"
  timeZone: "Europe/Dublin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: meeting-miner-sa
          restartPolicy: Never
          containers:
            - name: launcher
              image: quay.io/rh-ee-grasmith/meeting-miner-launcher:latest
              command: ["/bin/bash", "/app/launcher.sh"]
              env:
                - name: AGENT_IMAGE
                  value: "quay.io/rh-ee-grasmith/meeting-miner:latest"
                - name: OPENSHELL_GATEWAY_ENDPOINT
                  value: "http://openshell.openshell.svc.cluster.local:8080"
                - name: RADAR_DOC_ID
                  valueFrom:
                    secretKeyRef:
                      name: meeting-miner-secrets
                      key: RADAR_DOC_ID
                - name: GOOGLE_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: meeting-miner-secrets
                      key: GOOGLE_CLIENT_ID
                - name: GOOGLE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: meeting-miner-secrets
                      key: GOOGLE_CLIENT_SECRET
                - name: GOOGLE_REFRESH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: meeting-miner-secrets
                      key: GOOGLE_REFRESH_TOKEN
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: meeting-miner-secrets
                      key: SLACK_WEBHOOK_URL
                - name: JIRA_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: meeting-miner-secrets
                      key: JIRA_EMAIL
                - name: JIRA_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: meeting-miner-secrets
                      key: JIRA_API_TOKEN
                - name: ANTHROPIC_BASE_URL
                  value: "https://inference.local"
                - name: ANTHROPIC_API_KEY
                  value: "not-needed"
                - name: LLM_MODEL
                  value: "claude-sonnet-4-6"
                - name: DASHBOARD_DRIVE_FOLDER_ID
                  value: "1uoRAat9dcdX7LIu-5Tw-FkC3Q_fK3oVF"
              volumeMounts:
                - name: policy
                  mountPath: /app/policy-template.yaml
                  subPath: policy.yaml
          volumes:
            - name: policy
              configMap:
                name: meeting-miner-policy
